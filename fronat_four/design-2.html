<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>IF-OA · 贰</title>
<style>
/* 括号建筑 BRACKET MODERNISM：一切容器=巨型括号，蓝图线外露，衬线巨数字。灵感：符号串的结构嵌套 */
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0E1116;color:#E8ECF4;min-height:100vh;display:flex;flex-direction:column;align-items:center;
  font:14px/1.55 "Segoe UI Variable Text","Segoe UI",sans-serif}
.desktop{width:100%;padding:30px 0 64px;position:relative;
  background-image:
    linear-gradient(rgba(91,141,239,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(91,141,239,.05) 1px, transparent 1px);
  background-size:44px 44px}
.capsule{width:216px;height:36px;background:#151A22;border:1px solid #5B8DEF55;border-bottom:none;
  border-radius:18px 18px 0 0;margin:0 auto 0;display:flex;align-items:center;justify-content:center;gap:10px;color:#5B8DEF;font-size:11px;letter-spacing:3px}
.island{width:1280px;height:480px;background:#12161E;position:relative;
  outline:1px solid #5B8DEF55;display:grid;grid-template-columns:200px 1fr 1fr 1fr;grid-template-rows:40px 1fr}
.dim{position:absolute;font-size:10px;color:#5B8DEF88;letter-spacing:2px}
/* 顶部：标注式页签 */
.tabs{grid-column:1/5;border-bottom:1px solid #5B8DEF33;display:flex;align-items:center;padding:0 18px;gap:26px;font-family:Georgia,"Times New Roman",serif;font-size:15px}
.tabs b{color:#8FB6FF;font-weight:700}
.tabs span{color:#5A6377;cursor:pointer}
.tabs .u{margin-left:auto;font:10px/1 sans-serif;color:#5B8DEF66;letter-spacing:2px}
/* 左：导航=字面括号清单 */
.nav{border-right:1px solid #5B8DEF33;padding:26px 0 0 18px;font-family:Georgia,serif;font-size:19px;display:flex;flex-direction:column;gap:18px}
.nav i{font-style:normal;color:#5B8DEF;margin-right:8px}
.nav a{color:#C9D6EF;text-decoration:none;display:block}
.nav a.on{color:#8FB6FF}
/* 中左：待办 —— 括号即复选框 */
.sec{padding:26px 20px 0;position:relative}
.sec h3{font:700 13px/1 sans-serif;letter-spacing:4px;color:#5B8DEF;margin-bottom:18px}
.item{position:relative;padding:0 34px;margin-bottom:15px;font-size:15px;color:#DDE6F7}
.item::before{content:"[";position:absolute;left:0;top:-3px;font:700 20px Georgia;color:#5B8DEF}
.item::after{content:"]";position:absolute;left:19px;top:-3px;font:700 20px Georgia;color:#5B8DEF55}
.item.ok{color:#5A6377;text-decoration:line-through}
.item.ok::before{color:#8FB6FF;content:"<"}
.item.ok::after{content:">"}
.addrow{display:flex;gap:8px;margin:18px 0 0 0}
.addrow input{flex:1;background:#0E1116;border:1px solid #5B8DEF44;color:#DDE6F7;padding:8px 12px;font:inherit}
.addrow button{background:none;border:1px solid #5B8DEF;color:#8FB6FF;font:inherit;padding:0 16px;cursor:pointer}
/* 中右：天气 —— 衬线巨数字 + 蓝图尺寸标注 */
.weather{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%}
.weather .n{font:700 108px/1 Georgia,serif;color:#E8ECF4;position:relative}
.weather .n em{font-style:normal;font-size:26px;color:#8FB6FF;position:absolute;top:8px;right:-38px}
.weather .c{color:#8A94AB;font-size:13px;margin-top:10px;letter-spacing:2px}
/* 右：聊天 —— 电报稿纸 */
.chat{display:flex;flex-direction:column;padding:26px 20px 16px}
.chat .row{margin-bottom:10px;font-size:14px}
.chat .row .w{color:#5B8DEF;font-size:10px;letter-spacing:2px;display:block}
.chat .row.me{color:#8FB6FF;text-align:right}
.chat .send{margin-top:auto;display:flex;gap:8px}
.chat .send input{flex:1;background:#0E1116;border:1px solid #5B8DEF44;color:#DDE6F7;padding:8px 12px;font:inherit}
.chat .send button{background:#5B8DEF;border:0;color:#0E1116;font:inherit;font-weight:700;padding:0 18px;cursor:pointer}
.foot{grid-column:1/5;border-top:1px solid #5B8DEF33;font:10px/40px sans-serif;color:#5B8DEF66;letter-spacing:3px;padding:0 18px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="desktop">
  <div class="capsule">IF—OA 〔 结构层 〕</div>
  <div class="island">
    <span class="dim" style="top:6px;left:10px">W=1280</span>
    <span class="dim" style="top:6px;right:10px">H=480 · SCALE 1:1</span>
    <div class="tabs"><b>〔 工作台 〕</b><span>[ 文件 ]</span><span>&lt; 对话 &gt;</span><span>{ 我 }</span><span class="u">BRACKET MODERNISM · №2</span></div>
    <div class="nav">
      <a class="on"><i>{</i>工作台<i>}</i></a>
      <a><i>[</i>文件库<i>]</i></a>
      <a><i>&lt;</i>对话流<i>&gt;</i></a>
      <a><i>{</i>个人<i>}</i></a>
      <a style="color:#5A6377;font-size:15px;margin-top:26px"><i>·</i>设置<i>·</i></a>
    </div>
    <div class="sec">
      <h3>TODO INDEX</h3>
      <div class="item ok">季度预算表交财务</div>
      <div class="item">回复设计部配色提案</div>
      <div class="item">约王工评审接口契约</div>
      <div class="item">给新同学开仓库权限</div>
      <div class="addrow"><input placeholder="新增条目…"><button>+ 建</button></div>
    </div>
    <div class="sec weather">
      <div class="n">14<em>°C</em></div>
      <div class="c">北京 · 多云转晴 —————— 13°/21°</div>
    </div>
    <div class="chat">
      <div class="row"><span class="w">李雷 · 09:32</span>新版岛的颜色定了吗？</div>
      <div class="row me"><span class="w">我</span>定了，蓝图纸风格，下午发你</div>
      <div class="row"><span class="w">韩梅梅 · 09:40</span>报销单已批，记得看</div>
      <div class="send"><input placeholder="发电报…"><button>拍发</button></div>
    </div>
    <div class="foot"><span>STRUCTURE EXPOSED · 结构即装饰</span><span>NODE 04 / SEQ 2</span></div>
  </div>
</div>
</body>
</html>
