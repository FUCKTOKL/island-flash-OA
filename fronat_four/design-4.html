<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>IF-OA · 肆</title>
<style>
/* 审讯极简 INTERROGATION：无卡片无圆角无阴影，只有横线/方块/问号/巨数字。灵感：极短符号串的追问感 */
*{margin:0;padding:0;box-sizing:border-box}
body{background:#FAFAF7;color:#111;min-height:100vh;display:flex;flex-direction:column;align-items:center;
  font:14px/1.6 "Segoe UI Variable Text","Segoe UI",sans-serif}
.desktop{width:100%;padding:30px 0 64px;position:relative}
.desktop::after{content:"?";position:fixed;right:4vw;bottom:2vh;font-size:44vh;font-weight:800;
  color:rgba(229,18,46,.06);pointer-events:none;line-height:1}
.capsule{width:216px;height:36px;border:1px solid #111;border-bottom:none;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:11px}
.capsule i{font-style:normal;color:#E5122E;font-weight:800}
.island{width:1280px;height:480px;border:1px solid #111;position:relative;
  display:grid;grid-template-columns:1fr 1fr 1.15fr;grid-template-rows:56px 1fr 52px}
/* 顶：不是页签，是回答 */
.q{grid-column:1/4;border-bottom:1px solid #111;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.q h1{font-size:21px;font-weight:800;letter-spacing:1px}
.q h1 em{font-style:normal;color:#E5122E}
.q .nav{font-size:12px;letter-spacing:2px;color:#999}
.q .nav b{color:#111;border-bottom:3px solid #E5122E;padding-bottom:2px}
.q .nav span{margin-left:16px}
/* 待办：纯清单，方块复选 */
.sec{padding:22px;border-right:1px solid #111}
.sec h2{font-size:11px;letter-spacing:4px;color:#999;margin-bottom:14px}
.li{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid #E5E2D9;font-size:15px}
.li b{font-weight:400;color:#E5122E;font-size:12px;min-width:20px}
.box{width:13px;height:13px;border:2px solid #111;display:inline-block;transform:translateY(1px)}
.li.ok .box{background:#111}
.li.ok span{text-decoration:line-through;color:#AAA}
.add{display:flex;margin-top:14px;border:2px solid #111}
.add input{flex:1;border:0;background:none;padding:10px 12px;font:inherit;color:#111}
.add input:focus{outline:none;background:#FFF}
.add button{border:0;border-left:2px solid #111;background:#111;color:#FFF;font:inherit;font-weight:700;padding:0 18px;cursor:pointer}
/* 天气：只有一个答案 */
.wx{padding:22px;border-right:1px solid #111;display:flex;flex-direction:column;justify-content:center}
.wx .n{font-size:150px;font-weight:800;line-height:.95;letter-spacing:-6px}
.wx .n em{font-style:normal;font-size:28px;color:#E5122E}
.wx .sub{font-size:13px;color:#666;margin-top:8px;letter-spacing:1px}
/* 对话：笔录体 */
.ct{padding:22px 22px 0;display:flex;flex-direction:column}
.line{padding:7px 0;border-bottom:1px solid #E5E2D9;font-size:14px}
.line .w{color:#999;font-size:10px;letter-spacing:2px;margin-right:10px}
.line.me{text-align:right;color:#111}
.line.me .w{color:#E5122E}
.line.o{color:#333}
.send{margin-top:auto;display:flex;border:2px solid #111;margin-bottom:0}
.send input{flex:1;border:0;background:none;padding:10px 12px;font:inherit;color:#111}
.send input:focus{outline:none}
.send button{border:0;border-left:2px solid #111;background:#E5122E;color:#FFF;font:inherit;font-weight:800;padding:0 20px;cursor:pointer}
.f{grid-column:1/4;border-top:1px solid #111;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;font-size:10px;letter-spacing:3px;color:#999}
</style>
</head>
<body>
<div class="desktop">
  <div class="capsule"><span>IF—OA</span><i>3</i></div>
  <div class="island">
    <div class="q">
      <h1>今天，<em>做</em>什么？</h1>
      <nav class="nav"><b>现在</b><span>文件？</span><span>谁在找你？</span><span>你是谁？</span></nav>
    </div>
    <div class="sec">
      <h2>还要做 THESE REMAIN</h2>
      <div class="li ok"><span class="box"></span><span>季度预算表交财务</span><b>01</b></div>
      <div class="li"><span class="box"></span><span>回复设计部配色提案</span><b>02</b></div>
      <div class="li"><span class="box"></span><span>约王工评审接口契约</span><b>03</b></div>
      <div class="li"><span class="box"></span><span>给新同学开仓库权限</span><b>04</b></div>
      <div class="add"><input placeholder="现在做什么？"><button>做</button></div>
    </div>
    <div class="wx">
      <div class="n">14<em>°</em></div>
      <div class="sub">北京 · 多云转晴 · 13—21° · 东北风 2 级</div>
    </div>
    <div class="ct">
      <h2 style="font-size:11px;letter-spacing:4px;color:#999;margin-bottom:6px">他们说 THEY SAY</h2>
      <div class="line o"><span class="w">李雷 09:32</span>新版岛的颜色定了吗？</div>
      <div class="line me"><span class="w">我</span>定了，下午发你</div>
      <div class="line o"><span class="w">韩梅梅 09:40</span>报销单已批，记得看</div>
      <div class="send"><input placeholder="回答…"><button>答</button></div>
    </div>
    <div class="f"><span>NO CARDS / NO RADIUS / NO SHADOW</span><span>№4 — INTERROGATION</span></div>
  </div>
</div>
</body>
</html>
