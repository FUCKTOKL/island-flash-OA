<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>IF-OA · 叁 · 游标轨道</title>
<style>
/* 游标轨道 CALIPER RUN：刻度尺即导航、数据在轨道上滑动、游标指针指向当前项。
   灵感：符号串的 _ 基线与 > 指向感 */
*{margin:0;padding:0;box-sizing:border-box}
body{background:#14120E;color:#F0EBE0;min-height:100vh;display:flex;flex-direction:column;align-items:center;
  font:13px/1.6 "Segoe UI Variable Text","Segoe UI",sans-serif}
.desktop{width:100%;padding:26px 0 64px;background:
  radial-gradient(ellipse 60% 40% at 50% 0%,rgba(255,176,32,.05),transparent)}
.capsule{width:216px;height:36px;margin:0 auto 12px;border:1px solid #4A4436;border-bottom:none;
  border-radius:18px 18px 0 0;position:relative;display:flex;align-items:center;justify-content:center;
  color:#8A8070;font-size:10px;letter-spacing:3px}
.capsule::after{content:"";position:absolute;left:50%;bottom:6px;transform:translateX(-50%);
  width:52px;height:5px;background:#FFB020}
.island{width:1280px;height:480px;background:#1B1812;border:1px solid #4A4436;position:relative;
  display:flex;flex-direction:column}
/* 主刻度导航：横向大刻度尺 */
.rail{height:74px;border-bottom:1px solid #4A4436;display:flex;align-items:stretch;position:relative;background:#181510}
.tick{flex:1;border-right:1px solid #332E24;position:relative;cursor:pointer;
  display:flex;align-items:flex-end;padding:0 0 26px 18px;font-size:15px;color:#8A8070;letter-spacing:2px}
.tick small{position:absolute;top:10px;left:18px;font-size:9px;color:#5C5443;letter-spacing:2px}
.tick.on{color:#F0EBE0;background:#201C14}
.tick.on::after{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:#FFB020}
.tick:not(.on):hover{color:#C8BFA8}
.cursor{position:absolute;top:0;bottom:0;left:0;width:0;transition:left .5s cubic-bezier(.32,.72,0,1);pointer-events:none}
.cursor::before{content:">";position:absolute;top:8px;left:6px;color:#FFB020;font-size:18px;font-weight:700}
.cursor::after{content:"";position:absolute;top:34px;left:12px;bottom:0;width:2px;background:#FFB020}
body{counter-reset:none}
/* 三段轨道体 */
.tracks{flex:1;display:grid;grid-template-columns:1.05fr 320px 1fr}
.trk{padding:20px 22px 14px;position:relative}
.trk+.trk{border-left:1px solid #332E24}
.trk h3{font-size:10px;letter-spacing:4px;color:#8A8070;margin-bottom:4px}
/* 刻度条装饰 */
.ruler{height:22px;margin:6px 0 14px;position:relative;
  background:repeating-linear-gradient(90deg,#4A4436 0 1px,transparent 1px 10px)}
.ruler i{position:absolute;top:0;bottom:0;width:1px;background:#6B6250}
.ruler i:nth-child(5n){background:#8A8070;width:2px}
/* 待办=轨道节点 */
.node{position:relative;display:flex;align-items:center;gap:14px;padding:11px 0 11px 26px;
  border-bottom:1px dashed #332E24;font-size:15px}
.node::before{content:"";position:absolute;left:8px;top:50%;transform:translateY(-50%);
  width:8px;height:8px;background:#F0EBE0;clip-path:polygon(0 0,100% 50%,0 100%)}
.node.done{color:#5C5443;text-decoration:line-through}
.node.done::before{background:#5C5443}
.node .pos{margin-left:auto;font-size:10px;color:#8A8070;letter-spacing:1px}
.addrail{display:flex;gap:8px;margin-top:14px}
.addrail input{flex:1;background:#14120E;border:1px solid #4A4436;color:#F0EBE0;padding:9px 13px;font:inherit;outline:none}
.addrail input::placeholder{color:#5C5443}
.addrail button{background:#FFB020;color:#14120E;border:0;font:inherit;font-weight:800;padding:0 18px;cursor:pointer}
/* 天气=游标读数 */
.wx{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.wx .read{font-size:84px;font-weight:200;letter-spacing:-4px;line-height:1}
.wx .read b{font-weight:800;color:#FFB020}
.wx .thm{width:220px;height:26px;margin:22px 0 10px;position:relative;
  background:linear-gradient(90deg,#5C8AFF 0%,#7BC96F 35%,#FFB020 62%,#FF5C5C 100%);
  clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.wx .pin{position:absolute;top:-10px;left:38%;width:3px;height:46px;background:#F0EBE0}
.wx .pin::after{content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:#F0EBE0}
.wx .cap{font-size:11px;color:#8A8070;letter-spacing:2px}
/* 对话=往来列车 */
.msg{display:flex;gap:12px;margin-bottom:12px;font-size:14px}
.msg .tl{flex:none;width:26px;position:relative}
.msg .tl::before{content:"";position:absolute;left:12px;top:0;bottom:-12px;width:1px;background:#332E24}
.msg .tl i{position:absolute;left:8px;top:6px;width:9px;height:9px;background:#6B6250}
.msg:last-of-type .tl::before{display:none}
.msg.me .tl i{background:#FFB020}
.msg .bd .w{font-size:9px;color:#8A8070;letter-spacing:2px;display:block}
.sendt{margin-top:auto;display:flex;gap:8px}
.sendt input{flex:1;background:#14120E;border:1px solid #4A4436;color:#F0EBE0;padding:9px 13px;font:inherit;outline:none}
.sendt input::placeholder{color:#5C5443}
.sendt button{background:none;border:1px solid #FFB020;color:#FFB020;font:inherit;font-weight:700;padding:0 16px;cursor:pointer}
/* 底部读数条 */
.foot{height:30px;border-top:1px solid #4A4436;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;font-size:9px;letter-spacing:2px;color:#5C5443}
</style>
</head>
<body>
<div class="desktop">
  <div class="capsule">轨 道 · A 线</div>
  <div class="island">
    <div class="rail" id="rail">
      <div class="tick on" data-x="0" style="flex:1.15"><small>KM 000</small>工作台</div>
      <div class="tick" data-x="1"><small>KM 001</small>文件库</div>
      <div class="tick" data-x="2"><small>KM 002</small>对话线</div>
      <div class="tick" data-x="3"><small>KM 003</small>个人站</div>
      <div class="cursor" id="cur" style="left:0;width:calc(100%/4)"></div>
    </div>
    <div class="tracks">
      <div class="trk">
        <h3>任务轨道 · 前方 3 站</h3>
        <div class="ruler"><i style="left:0"></i><i style="left:10%"></i><i style="left:20%"></i><i style="left:30%"></i><i style="left:40%"></i><i style="left:50%"></i><i style="left:60%"></i><i style="left:70%"></i><i style="left:80%"></i><i style="left:90%"></i><i style="left:100%"></i></div>
        <div class="node done">季度预算表交财务<span class="pos">K11 · 已过站</span></div>
        <div class="node">回复设计部配色提案<span class="pos">K12 · 下一站</span></div>
        <div class="node">约王工评审接口契约<span class="pos">K13</span></div>
        <div class="node">给新同学开仓库权限<span class="pos">K14</span></div>
        <div class="addrail"><input placeholder="铺一条新轨道…"><button>接入</button></div>
      </div>
      <div class="wx">
        <div class="read"><b>14</b>°</div>
        <div class="thm"><i class="pin" style="left:38%"></i></div>
        <div class="cap">北京 · 多云转晴 · 13—21°</div>
      </div>
      <div class="trk">
        <h3>对话线 · 双向开行</h3>
        <div class="msg"><span class="tl"><i></i></span><span class="bd"><span class="w">李雷 · 09:32 发车</span>新版岛的颜色定了吗？</span></div>
        <div class="msg me"><span class="tl"><i></i></span><span class="bd"><span class="w">我 · 09:33 折返</span>定了，下午发你</span></div>
        <div class="msg"><span class="tl"><i></i></span><span class="bd"><span class="w">韩梅梅 · 09:40 到站</span>报销单已批，记得看</span></div>
        <div class="sendt"><input placeholder="发车…"><button>开行</button></div>
      </div>
    </div>
    <div class="foot"><span>CALIPER RUN · 刻度即导航</span><span>读数 09:41 · 里程 0041.7</span></div>
  </div>
</div>
<script>
// 游标滑动（纯演示交互）
const rail=document.getElementById("rail"),cur=document.getElementById("cur");
rail.querySelectorAll(".tick").forEach(t=>t.addEventListener("click",()=>{
  rail.querySelectorAll(".tick").forEach(x=>x.classList.remove("on"));
  t.classList.add("on");
  const i=[...rail.querySelectorAll(".tick")].indexOf(t);
  cur.style.left=(i*25)+"%";cur.style.width="25%";
}));
</script>
</body>
</html>
