<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>IF-OA · 岛一 · 斜谷</title>
<style>
/* 斜谷 SLASH VALLEY：岛体=平行四边形斜切玻璃，模块沿 30° 斜轴排布，零垂直分割线。
   语言基底=单元矩阵 v3.2 冷调毛玻璃（冰白×石板×青蓝×覆盆子）。灵感：符号串的 \\ | < 斜线交织 */
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(160deg,#E7ECF2,#EDF1F6,#E3E9F0);color:#2E3440;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;
  font:15px/1.6 "Segoe UI Variable Text","Segoe UI",sans-serif}
.orb{position:fixed;border-radius:50%;pointer-events:none;filter:blur(4px)}
.o1{width:560px;height:560px;left:-160px;top:-220px;background:radial-gradient(circle at 40% 40%,rgba(79,163,165,.40),transparent 65%)}
.o2{width:620px;height:620px;right:-200px;bottom:-260px;background:radial-gradient(circle at 60% 40%,rgba(127,168,217,.32),transparent 65%)}
.desktop{width:100%;padding:26px 0 70px;position:relative;z-index:1}
/* 胶囊：斜切胶囊（非标准 pill——右端 30° 切角） */
.capsule{width:216px;height:36px;margin:0 auto 10px;background:rgba(246,248,251,.6);
  border:1px solid rgba(222,227,233,.8);backdrop-filter:blur(20px) saturate(1.3);
  clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);
  display:flex;align-items:center;justify-content:space-between;padding:0 22px;
  font-size:10px;letter-spacing:3px;color:#7E8A99;cursor:pointer}
.capsule i{font-style:normal;width:8px;height:8px;background:#4FA3A5;border-radius:50%;box-shadow:0 0 8px rgba(79,163,165,.8)}
.capsule .b{font-size:9px;color:#FFF;background:#C74E5C;padding:0 6px;border-radius:8px}
/* 岛：斜切平行四边形大玻璃（上边左移 36px），从胶囊长出 */
.island{width:1280px;height:470px;position:relative;
  background:rgba(246,248,251,.66);border:1px solid rgba(222,227,233,.85);
  backdrop-filter:blur(26px) saturate(1.25);
  clip-path:polygon(36px 0,100% 0,100% 100%,0 100%);
  animation:grow .7s cubic-bezier(.32,.72,0,1);transform-origin:top center}
@keyframes grow{from{transform:scaleY(.076) ;opacity:0}}
/* 斜轴内容：整块内容旋转 -4.5°，模块间用斜切 gap */
.slope{position:absolute;inset:0;transform:rotate(-4.5deg) scale(1.02);transform-origin:center;
  display:grid;grid-template-columns:1.9fr 1fr 1.15fr;grid-template-rows:44px 1fr 1fr;gap:12px;padding:10px 30px}
/* 浮片（v3.2 卡）但每片自身斜切 */
.card{border:1px solid rgba(222,227,233,.95);border-radius:10px;background:rgba(255,255,255,.5);
  backdrop-filter:blur(16px) saturate(1.2);padding:12px 15px;position:relative;
  box-shadow:0 2px 10px rgba(46,52,64,.05),inset 0 1px 0 rgba(255,255,255,.65);
  clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);
  transition:transform .3s cubic-bezier(.32,.72,0,1),box-shadow .3s cubic-bezier(.32,.72,0,1);
  animation:rise .55s cubic-bezier(.32,.72,0,1) backwards}
.card:nth-child(1){animation-delay:.05s}.card:nth-child(2){animation-delay:.12s}
.card:nth-child(3){animation-delay:.19s}.card:nth-child(4){animation-delay:.26s}
.card:nth-child(5){animation-delay:.33s}
@keyframes rise{from{transform:translate(10px,10px);opacity:0}}
.card:hover{transform:translateY(-2px) rotate(.4deg);box-shadow:0 14px 30px rgba(46,52,64,.13)}
.hd{grid-column:1/4;display:flex;align-items:center;justify-content:space-between;padding:0 8px;
  background:none;border:0;box-shadow:none;clip-path:none;backdrop-filter:none;font-size:11px;letter-spacing:3px;color:#7E8A99}
.hd:hover{transform:none;box-shadow:none}
.hd b{font-family:"Segoe UI Variable Display",sans-serif;font-size:17px;font-weight:650;color:#2E3440}
.hd b em{font-style:normal;color:#4FA3A5}
.hd .clock{font-family:"Cascadia Mono",Consolas,monospace}
.lab{font-family:"Cascadia Mono",Consolas,monospace;font-size:10px;letter-spacing:2px;color:#7E8A99;
  display:flex;justify-content:space-between;margin-bottom:6px}
.lab b{color:#2E3440;font-weight:700}
/* 待办（斜列） */
.item{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid rgba(227,232,240,.7);font-size:14px}
.item .sq{width:12px;height:12px;border:2px solid #A8B2BE;border-radius:3px;flex:none}
.item.ok .sq{background:#4FA3A5;border-color:#4FA3A5}
.item.ok span{color:#A8B2BE;text-decoration:line-through}
.tadd{display:flex;margin-top:8px;border:1px solid rgba(216,222,230,.95);border-radius:9px;overflow:hidden;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.tadd input{flex:1;border:0;background:rgba(255,255,255,.6);padding:6px 11px;font:inherit;outline:none}
.tadd button{border:0;border-left:1px solid rgba(216,222,230,.95);background:rgba(240,244,249,.6);font:inherit;font-weight:650;padding:0 13px;cursor:pointer}
.tadd button:hover{background:#4FA3A5;color:#FFF}
/* 天气：斜置大数字 */
.wx{display:flex;flex-direction:column;justify-content:center}
.wx .n{font-family:"Segoe UI Variable Display",sans-serif;font-size:54px;font-weight:650;line-height:1;letter-spacing:-2px}
.wx .n em{font-style:normal;font-size:18px;color:#7E8A99}
.wx .s{font-size:11px;color:#7E8A99;margin-top:6px}
/* 审批 hero：烟熏石板，斜切更狠 */
.appr{background:rgba(40,45,54,.78);color:#EFF3F8;border-color:rgba(40,45,54,.8);display:flex;flex-direction:column;grid-row:span 2}
.appr .lab{color:#98A3B2}.appr .lab b{color:#EFF3F8}
.appr .big{font-family:"Segoe UI Variable Display",sans-serif;font-size:56px;font-weight:650;color:#E8A0AC;line-height:1;margin-top:8px;text-shadow:0 0 24px rgba(232,160,172,.45)}
.appr ul{list-style:none;margin-top:8px}
.appr li{display:flex;gap:7px;align-items:center;font-size:12px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.09)}
.appr li .u{width:6px;height:6px;background:#E8A0AC;border-radius:50%;animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.3}}
.appr li .w{margin-left:auto;font-family:"Cascadia Mono",monospace;font-size:9px;color:#98A3B2}
.appr .go{margin-top:auto;text-align:center;border:1px solid rgba(255,255,255,.22);border-radius:9px;
  font-size:10px;letter-spacing:2px;padding:6px 0;cursor:pointer;background:rgba(255,255,255,.05)}
.appr .go:hover{background:rgba(199,78,92,.85)}
/* 对话 */
.chat{display:flex;flex-direction:column}
.ms{font-size:13px;padding:4px 0}
.ms .w{font-family:"Cascadia Mono",monospace;font-size:9px;color:#A0AAB7;margin-right:8px}
.ms.me{text-align:right}
.ms.me .bb{background:rgba(46,52,64,.88);color:#EFF3F8;padding:3px 9px;border-radius:10px 10px 10px 3px}
.ms.o .bb{background:rgba(238,242,247,.85);padding:3px 9px;border-radius:10px 10px 3px 10px;border:1px solid rgba(222,227,233,.7)}
.cs{margin-top:auto;display:flex;border:1px solid rgba(216,222,230,.95);border-radius:9px;overflow:hidden;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.cs input{flex:1;border:0;background:rgba(255,255,255,.6);padding:6px 11px;font:inherit;outline:none}
.cs button{border:0;border-left:1px solid rgba(216,222,230,.95);background:rgba(240,244,249,.6);font:inherit;font-weight:700;padding:0 12px;cursor:pointer}
.cs button:hover{background:#C74E5C;color:#FFF}
.hint{font-family:"Cascadia Mono",monospace;font-size:9px;letter-spacing:2px;color:#A0AAB7;margin-top:12px}
</style>
</head>
<body>
<i class="orb o1"></i><i class="orb o2"></i>
<div class="desktop">
  <div class="capsule" onclick="replay()"><span>IF—OA / 斜谷</span><span><i></i> <span class="b">3</span></span></div>
  <div class="island" id="island">
    <div class="slope">
      <div class="hd"><b>斜谷 <em>/ 今日</em></b><span class="clock" id="clock">—</span></div>
      <div class="card" style="grid-row:span 2">
        <div class="lab"><b>任务</b><span>V1</span></div>
        <div class="item ok"><i class="sq"></i><span>季度预算表交财务</span></div>
        <div class="item"><i class="sq"></i><span>回复设计部配色提案</span></div>
        <div class="item"><i class="sq"></i><span>约王工评审接口契约</span></div>
        <div class="item"><i class="sq"></i><span>给新同学开仓库权限</span></div>
        <div class="tadd"><input placeholder="新任务…"><button>置入</button></div>
      </div>
      <div class="card wx">
        <div class="lab"><b>天气</b><span>V2</span></div>
        <div class="n">14<em>°C</em></div>
        <div class="s">北京 · 多云转晴 · 13—21°</div>
      </div>
      <div class="card appr">
        <div class="lab"><b>审批</b><span>V3</span></div>
        <div class="big">3</div>
        <ul>
          <li><i class="u"></i>设备采购 · 8,400<span class="w">08:12 急</span></li>
          <li><i class="u"></i>调休 · 小刘<span class="w">昨</span></li>
          <li><i class="u" style="background:#4FA3A5"></i>用印 · 已会签<span class="w">昨</span></li>
        </ul>
        <div class="go">进入审批 ›</div>
      </div>
      <div class="card chat">
        <div class="lab"><b>对话</b><span>V4</span></div>
        <div class="ms o"><span class="w">李雷</span><span class="bb">新版岛的颜色定了吗？</span></div>
        <div class="ms me"><span class="w">我</span><span class="bb">定了，下午发你</span></div>
        <div class="cs"><input placeholder="说…"><button>发</button></div>
      </div>
    </div>
  </div>
  <div class="hint">SLASH VALLEY · 零垂直线 · 点胶囊重播展开</div>
</div>
<script>
function replay(){const i=document.getElementById("island");i.style.animation="none";i.offsetHeight;i.style.animation="";}
const wd=["日","一","二","三","四","五","六"],t=new Date();
document.getElementById("clock").textContent=`星期${wd[t.getDay()]} · ${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")} · 北京`;
</script>
</body>
</html>
